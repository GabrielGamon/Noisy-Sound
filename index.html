<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noisy Sound">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<title>Noisy Sound</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><h1 id="screen-title">Início</h1></div>
    <button class="icon-btn top-search" data-tab-go="search" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  </header>

  <main id="view"></main>

  <div id="mini" class="mini hidden">
    <div class="mini-progress"><span id="mini-bar"></span></div>
    <button class="mini-open" id="mini-open">
      <div class="cover sm" id="mini-cover"></div>
      <div class="meta"><div class="t" id="mini-title"></div><div class="a" id="mini-artist"></div></div>
    </button>
    <button class="icon-btn mini-like" id="mini-like" aria-label="Curtir"></button>
    <button class="icon-btn" id="mini-play" aria-label="Tocar/pausar"></button>
    <button class="icon-btn" id="mini-next" aria-label="Próxima">
      <svg viewBox="0 0 24 24"><path d="M6 5.5l9.5 6.5L6 18.5z" class="fill"/><rect x="16.5" y="5" width="2.4" height="14" rx="1.2" class="fill"/></svg>
    </button>
  </div>

  <nav class="tabs">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Início</span></button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Pesquisar</span></button>
    <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4l5 15.5"/></svg><span>Biblioteca</span></button>
    <button data-tab="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
  </nav>
</div>

<section id="player" class="player" aria-hidden="true">
  <div class="player-art" id="player-art"></div>
  <div class="player-shade"></div>
  <div class="player-inner">
    <div class="player-head">
      <button class="icon-btn" id="player-close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="player-from" id="player-from">Tocando agora</span>
      <button class="icon-btn" id="player-more" aria-label="Opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" class="fill"/><circle cx="12" cy="12" r="1.4" class="fill"/><circle cx="19" cy="12" r="1.4" class="fill"/></svg></button>
    </div>
    <div class="player-labels">
      <span class="lbl lbl-t" id="player-title"></span>
      <span class="lbl lbl-a" id="player-artist"></span>
    </div>
    <div class="player-space"></div>
    <div class="wave" id="wave"><canvas id="wave-canvas"></canvas><span class="wave-time cur" id="t-cur">0:00</span><span class="wave-time dur" id="t-dur">0:00</span></div>
    <div class="controls">
      <button class="icon-btn" id="btn-shuffle" aria-label="Aleatório"><svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h4M3 17h3c1.6 0 2.8-1.6 3.9-3.5M14 9.5C15 8 16 7 18 7h2M17 4l3 3-3 3M17 14l3 3-3 3"/></svg></button>
      <button class="icon-btn" id="btn-prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M18 5.5L8.5 12l9.5 6.5z" class="fill"/><rect x="5.1" y="5" width="2.4" height="14" rx="1.2" class="fill"/></svg></button>
      <button class="play-big" id="btn-play" aria-label="Tocar/pausar"></button>
      <button class="icon-btn" id="btn-next" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M6 5.5l9.5 6.5L6 18.5z" class="fill"/><rect x="16.5" y="5" width="2.4" height="14" rx="1.2" class="fill"/></svg></button>
      <button class="icon-btn" id="btn-repeat" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 013-3h13M17 3l3 3-3 3M20 13v2a3 3 0 01-3 3H4M7 21l-3-3 3-3"/></svg><i class="one">1</i></button>
    </div>
    <div class="player-actions">
      <button class="pa like" id="player-like"></button>
      <button class="pa" id="player-add"></button>
      <button class="pa" id="player-artist-btn"></button>
    </div>
  </div>
</section>

<div id="sheet" class="sheet" aria-hidden="true"><div class="sheet-card" id="sheet-card"></div></div>
<div id="dialog" class="dialog" aria-hidden="true"><form class="dialog-card" id="dialog-card" autocomplete="off"></form></div>
<div id="toast" class="toast"></div>

<audio id="audio" preload="auto" playsinline></audio>
<script src="db.js"></script>
<script src="player.js"></script>
<script src="catalog.js"></script>
<script src="recommend.js"></script>
<script src="app.js"></script>
</body>
</html>
